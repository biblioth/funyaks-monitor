name: Cloudflare watchdog and fallback

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funyaks-cloudflare-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HEALTH_URL: ${{ vars.CLOUDFLARE_HEALTH_URL }}
      CHECK_URL: ${{ vars.CLOUDFLARE_CHECK_URL }}
      ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore fallback state
        uses: actions/cache@v4
        with:
          path: .state
          key: funyaks-fallback-state-${{ github.run_id }}
          restore-keys: |
            funyaks-fallback-state-

      - name: Probe Cloudflare and request self-healing check
        id: cloudflare
        shell: bash
        run: |
          set +e
          if [[ -z "$HEALTH_URL" ]]; then
            echo "Cloudflare health URL is not configured."
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(curl --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 --output health.json \
            --write-out '%{http_code}' "$HEALTH_URL")"
          if [[ "$status" == "200" ]]; then
            cat health.json
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Cloudflare health returned HTTP $status; requesting a manual check."
          if [[ -n "$CHECK_URL" && -n "$ADMIN_TOKEN" ]]; then
            curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --request POST --header "Authorization: Bearer $ADMIN_TOKEN" \
              --output check.json "$CHECK_URL"
            [[ -s check.json ]] && cat check.json
          fi

          status="$(curl --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 --output health-after.json \
            --write-out '%{http_code}' "$HEALTH_URL")"
          [[ -s health-after.json ]] && cat health-after.json
          if [[ "$status" == "200" ]]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Run independent website fallback
        if: steps.cloudflare.outputs.healthy != 'true'
        run: python3 funyaks_monitor.py
        env:
          TARGET_DATE: "2027-02-02"
          PARTY_SIZE: "1"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}

      - name: Send deduplicated watchdog status notification
        if: always()
        run: >-
          python3 watchdog_notify.py
          ${{ steps.cloudflare.outputs.healthy == 'true' && 'healthy' || 'unhealthy' }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}

      - name: Preserve unhealthy Cloudflare response
        if: always() && steps.cloudflare.outputs.healthy != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            health.json
            health-after.json
            check.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail when Cloudflare remains unhealthy
        if: always() && steps.cloudflare.outputs.healthy != 'true'
        run: |
          echo "::error::Cloudflare monitor is unhealthy; the independent fallback check was used."
          exit 1
