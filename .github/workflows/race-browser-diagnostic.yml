name: Diagnose public race pages in an isolated browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Read public pages without login, solving challenges or sending notifications
        run: |
          xvfb-run python - <<'PY'
          from playwright.sync_api import sync_playwright, TimeoutError
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=False)
              for url, expected in [
                  ("https://hk100ultra.com/", "2027 Events"),
                  ("https://www.kailas.com.cn/Home/Article/BrandNews/type/1.html", "品牌新闻"),
              ]:
                  context = browser.new_context()
                  page = context.new_page()
                  try:
                      response = page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      try:
                          page.get_by_text(expected, exact=False).first.wait_for(timeout=15000)
                      except TimeoutError:
                          pass
                      print(url, "HTTP", response.status if response else None, "title", page.title(), "expected_content", expected in page.locator("body").inner_text(), flush=True)
                  except Exception as e:
                      print(url, type(e).__name__, flush=True)
                  finally:
                      context.close()
              browser.close()
          PY
