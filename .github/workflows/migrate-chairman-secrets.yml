name: One-time Chairman secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MIGRATION_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 71742b04e78ba85c7f520b8c6f006b60
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
    steps:
      - name: Install Wrangler
        run: npm install --global wrangler@4.132.0
      - name: Copy notification secrets without exposing their values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FEISHU_WEBHOOK_URL"
          test -n "$FEISHU_WEBHOOK_SECRET"
          test -n "$PUSHPLUS_TOKEN"
          printf '%s' "$FEISHU_WEBHOOK_URL" | wrangler secret put FEISHU_WEBHOOK_URL --name chairman-monitor
          printf '%s' "$FEISHU_WEBHOOK_SECRET" | wrangler secret put FEISHU_WEBHOOK_SECRET --name chairman-monitor
          printf '%s' "$PUSHPLUS_TOKEN" | wrangler secret put PUSHPLUS_TOKEN --name chairman-monitor
          if [ -n "$PUSHPLUS_TOPIC" ]; then
            printf '%s' "$PUSHPLUS_TOPIC" | wrangler secret put PUSHPLUS_TOPIC --name chairman-monitor
          fi
