name: Weekly monitor report

on:
  schedule:
    # Sunday 10:10 Asia/Shanghai, ten minutes after the Cloudflare primary run.
    - cron: "10 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REPORT_URL: ${{ vars.CLOUDFLARE_WEEKLY_REPORT_URL }}
      ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
    steps:
      - name: Request idempotent weekly report
        shell: bash
        run: |
          test -n "$REPORT_URL"
          test -n "$ADMIN_TOKEN"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --request POST --header "Authorization: Bearer $ADMIN_TOKEN" \
            "$REPORT_URL"
