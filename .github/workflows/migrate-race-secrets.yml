name: Transfer race notification secrets securely
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt only the existing Feishu robot settings for the new monitor
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, base64, subprocess
          from pathlib import Path
          Path("recipient.pem").write_bytes(base64.b64decode(""))
          values = {k: os.environ.get(k, "") for k in ["FEISHU_WEBHOOK_URL", "FEISHU_WEBHOOK_SECRET"]}
          if not values["FEISHU_WEBHOOK_URL"]:
              raise SystemExit("Existing robot is not configured")
          payload = json.dumps(values).encode()
          if len(payload) > 440:
              raise SystemExit("Secret payload exceeds envelope capacity")
          with open("feishu-secrets.enc", "wb") as out:
              subprocess.run(["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "recipient.pem", "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256"], input=payload, stdout=out, check=True)
          print("Encrypted notification configuration; no plaintext artifact was created")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: race-notification-transfer
          path: feishu-secrets.enc
          retention-days: 1
